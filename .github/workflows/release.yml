name: Publication

# Une étiquette `vX.Y.Z` construit les installateurs et le serveur autonome, puis
# prépare un **brouillon** de release : rien n'est publié sans relecture.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Contrôle de version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # L'étiquette, l'application de bureau et le serveur doivent annoncer la même version.
      - name: Versions concordantes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          desktop=$(jq -r .version apps/desktop/tauri.conf.json)
          server=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "étiquette $tag, bureau $desktop, serveur $server"
          test "$tag" = "$desktop" && test "$tag" = "$server"

  desktop:
    name: Installateurs (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi,nsis
          # La plus ancienne glibc prise en charge : l'AppImage fonctionne sur plus de distributions.
          - os: ubuntu-22.04
            bundles: deb,rpm,appimage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dépendances système (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libxdo-dev file
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/desktop
      - run: cargo install tauri-cli --version "=2.12.1" --locked
      # Signature Authenticode : uniquement si le titulaire a déposé son certificat dans
      # les secrets du dépôt (WINDOWS_CERTIFICATE en base64, WINDOWS_CERTIFICATE_PASSWORD).
      - name: Préparer la signature (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            "::warning::Aucun certificat : installateurs Windows NON signés (avertissement SmartScreen)."
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP "phonalys-signature.pfx"
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $script = (Resolve-Path .github/scripts/sign-windows.ps1).Path -replace '\\', '/'
          $config = @{ bundle = @{ windows = @{ signCommand = @{ cmd = "pwsh"; args = @("-NoProfile", "-File", $script, "%1") } } } }
          $config | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP "signature.json")
          "PHONALYS_PFX=$pfx" >> $env:GITHUB_ENV
      - name: Construire
        working-directory: apps/desktop
        shell: bash
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          # Clé de signature des mises à jour, générée et déposée par le titulaire.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy (AppImage) sans FUSE sur les machines de CI.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          extra=()
          if [ -f "$RUNNER_TEMP/signature.json" ]; then extra=(--config "$RUNNER_TEMP/signature.json"); fi
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo '{"bundle":{"createUpdaterArtifacts":true}}' > "$RUNNER_TEMP/updater.json"
            extra+=(--config "$RUNNER_TEMP/updater.json")
          else
            echo "::warning::Aucune clé TAURI_SIGNING_PRIVATE_KEY : pas de mise à jour automatique pour cette version."
          fi
          cargo tauri build --bundles ${{ matrix.bundles }} "${extra[@]}" -- --locked
      - name: Effacer le certificat
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP "phonalys-signature.pfx")
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bureau-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/target/release/bundle/msi/*.msi
            apps/desktop/target/release/bundle/nsis/*.exe
            apps/desktop/target/release/bundle/deb/*.deb
            apps/desktop/target/release/bundle/rpm/*.rpm
            apps/desktop/target/release/bundle/appimage/*.AppImage
            apps/desktop/target/release/bundle/*/*.sig

  server:
    name: Serveur autonome (${{ matrix.os }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p phonalys-server
      # Le serveur cherche l'interface dans le dossier `web` à côté de l'exécutable.
      - name: Archive
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          os=$([ "$RUNNER_OS" = "Windows" ] && echo windows || echo linux)
          name="phonalys-server-$version-$os-x64"
          mkdir -p "$name/web" out
          cp -r web/dist/. "$name/web/"
          cp LICENSE docs/SECURITE.md docs/INSTALLATION.md "$name/"
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/phonalys-server.exe "$name/"
            pwsh -NoProfile -Command "Compress-Archive -Path '$name' -DestinationPath 'out/$name.zip'"
          else
            cp target/release/phonalys-server "$name/"
            tar -czf "out/$name.tar.gz" "$name"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: serveur-${{ runner.os }}
          if-no-files-found: error
          path: out/*

  publish:
    name: Brouillon de release
    needs: [desktop, server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      # Les installateurs arrivent rangés par format (msi/, nsis/, deb/…) : on les remonte.
      - name: Aplatir
        working-directory: dist
        run: |
          find . -mindepth 2 -type f -exec mv -n -t . {} +
          find . -mindepth 1 -type d -empty -delete
          if [ -n "$(find . -mindepth 1 -type d)" ]; then echo "Fichiers en double" >&2; exit 1; fi
          ls -l
      # Manifeste lu par les applications installées (page publique des versions).
      # Chaque signature doit porter la version : l'application refuse sinon
      # (protection contre le retour à une ancienne version).
      - name: Manifeste de mise à jour
        working-directory: dist
        env:
          PUBLIC_REPO: Bibi002/phonalys-releases
        run: |
          shopt -s nullglob
          sigs=(*.sig)
          if [ ${#sigs[@]} -eq 0 ]; then echo "Pas de signature de mise à jour : manifeste non produit."; exit 0; fi
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/$PUBLIC_REPO/releases/download/$GITHUB_REF_NAME"
          platforms="{}"
          for sig in "${sigs[@]}"; do
            file="${sig%.sig}"
            case "$file" in
              *-setup.exe) key=windows-x86_64-nsis ;;
              *.msi) key=windows-x86_64-msi ;;
              *.AppImage) key=linux-x86_64-appimage ;;
              *.deb) key=linux-x86_64-deb ;;
              *.rpm) key=linux-x86_64-rpm ;;
              *) echo "Signature inattendue : $sig" >&2; exit 1 ;;
            esac
            comment=$(base64 -d "$sig" | sed -n 3p)
            case "$comment" in *"version:$version"*) ;; *) echo "Version absente ou différente dans $sig : $comment" >&2; exit 1 ;; esac
            platforms=$(jq --arg k "$key" --arg u "$base/$file" --arg s "$(cat "$sig")" '. + {($k): {url: $u, signature: $s}}' <<<"$platforms")
          done
          jq -n --arg v "$version" --arg d "$(date -u +%Y-%m-%dT%H:%M:%SZ)"             --arg n "Nouvelle version de Phonalys. Détails : https://github.com/$PUBLIC_REPO/releases/tag/$GITHUB_REF_NAME"             --argjson p "$platforms" '{version: $v, notes: $n, pub_date: $d, platforms: $p}' > latest.json
          cat latest.json
      - name: Empreintes SHA-256
        working-directory: dist
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      # Attestation de provenance (SLSA) : réservée aux dépôts publics sur les offres gratuites.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Créer le brouillon
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --draft --verify-tag \
            --title "Phonalys ${GITHUB_REF_NAME#v}" \
            --notes "Vérifiez les empreintes avec SHA256SUMS.txt avant installation. Relisez ce brouillon, puis publiez-le."
