# Copie d'une version publiée vers la page publique de téléchargement
# (Bibi002/phonalys-releases), qui la signe ensuite automatiquement (Sigstore).
#
# Exige le secret PUBLIC_RELEASES_TOKEN : jeton d'accès « fine-grained » créé par le
# titulaire, limité au seul dépôt phonalys-releases avec la permission
# « Contents : Read and write ». Sans lui, rien n'est copié.
name: Diffusion publique

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Version à diffuser (par exemple v0.1.2)
        required: true

permissions:
  contents: read

concurrency:
  group: diffusion
  cancel-in-progress: false

jobs:
  mirror:
    name: Copier vers le dépôt public
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      PUBLIC_REPO: Bibi002/phonalys-releases
    steps:
      - name: Vérifier le jeton
        env:
          PUBLIC_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          case "$TAG" in v[0-9]*) ;; *) echo "Étiquette invalide : $TAG" >&2; exit 1 ;; esac
          if [ -z "$PUBLIC_TOKEN" ]; then
            echo "::error::Secret PUBLIC_RELEASES_TOKEN absent : voir docs/PUBLICATION.md."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: docs/INSTALLATION.md
          sparse-checkout-cone-mode: false
      - name: Télécharger et vérifier
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" -D dist
          (cd dist && sha256sum --check --strict SHA256SUMS.txt)
          cp docs/INSTALLATION.md dist/
          gh release view "$TAG" --json body --jq .body > notes.md
      - name: Publier
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
        run: |
          if gh release view "$TAG" -R "$PUBLIC_REPO" >/dev/null 2>&1; then
            echo "::error::$TAG existe déjà sur $PUBLIC_REPO : rien n'est remplacé."
            exit 1
          fi
          gh release create "$TAG" -R "$PUBLIC_REPO" --title "Phonalys ${TAG#v}" \
            --notes-file notes.md --latest dist/*
