# Politique de la chaîne d'approvisionnement, vérifiée par cargo-deny en CI.

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9
private = { ignore = true }
# Liste des certificats racines (données Mozilla), utilisée par le téléchargement des
# mises à jour : licence de données permissive, compatible avec un usage commercial.
exceptions = [
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-root-certs" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Les crates internes (publish = false) se référencent par chemin, sans version.
allow-wildcard-paths = true
# OpenSSL est exclu : tout le TLS passe par rustls.
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
