[package]
name = "phonalys-desktop"
description = "Application de bureau Phonalys (Windows, Linux) : serveur local embarqué."
version = "0.1.3"
edition = "2021"
rust-version = "1.89"
license = "LicenseRef-Phonalys-Proprietary"
publish = false

# Espace de travail séparé : les dépendances graphiques de Tauri restent hors du cœur.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
phonalys-server = { path = "../../crates/phonalys-server" }
phonalys-auth = { path = "../../crates/phonalys-auth" }
phonalys-crypto = { path = "../../crates/phonalys-crypto" }
phonalys-webauthn = { path = "../../crates/phonalys-webauthn" }
phonalys-vault = { path = "../../crates/phonalys-vault" }
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["net", "time"] }
axum = "0.8"
url = "2"
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Sans la fonction « zip » : les mises à jour sont les installateurs eux-mêmes (pas
# d'archive), et zip 4.x porte RUSTSEC-2026-0367 à 0369.
tauri-plugin-updater = { version = "=2.13.1", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "=2.8.4"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true
